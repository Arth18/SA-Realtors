<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="stage" id="stage">

    <div class="stage__media" aria-hidden="true">
      <div class="poster" id="poster"></div>
      <video id="hero" preload="metadata" muted playsinline autoplay loop aria-hidden="true" tabindex="-1"></video>
      <div class="skylift"></div>

      <!-- the survey boundary draws itself in once on load, then holds -->
      <svg class="lot" id="lot" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <mask id="lotMask" maskUnits="userSpaceOnUse">
            <path class="drawmask" id="lotMaskPath" d="M 1300 600 L 1760 575 L 1800 745 L 1330 785 Z" fill="none" stroke="#fff" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"></path>
          </mask>
        </defs>
        <path class="lot__fill" d="M 1300 600 L 1760 575 L 1800 745 L 1330 785 Z"></path>
        <path class="lot__line" id="lotLine" d="M 1300 600 L 1760 575 L 1800 745 L 1330 785 Z" mask="url(#lotMask)"></path>
        <g class="lot__pegs" id="lotPegs">
          <g class="peg" style="--i:0"><rect x="-9" y="-9" width="18" height="18" transform="translate(1300,600) rotate(45)"></rect><circle cx="1300" cy="600" r="3.4"></circle></g>
          <g class="peg" style="--i:1"><rect x="-9" y="-9" width="18" height="18" transform="translate(1760,575) rotate(45)"></rect><circle cx="1760" cy="575" r="3.4"></circle></g>
          <g class="peg" style="--i:2"><rect x="-9" y="-9" width="18" height="18" transform="translate(1800,745) rotate(45)"></rect><circle cx="1800" cy="745" r="3.4"></circle></g>
          <g class="peg" style="--i:3"><rect x="-9" y="-9" width="18" height="18" transform="translate(1330,785) rotate(45)"></rect><circle cx="1330" cy="785" r="3.4"></circle></g>
        </g>
      </svg>

      <p class="loadring" id="loadring" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="126" style="stroke-dashoffset:var(--ld,126)"></circle></svg>
      </p>
    </div>

    <div class="herotext">
      <div class="settle">
        <div class="settle__body">
          <p class="kicker"><span class="pegmark" aria-hidden="true"></span>Adelaide, South Australia</p>
          <h1 class="hline hline--h1">Your land. Your future.</h1>
          <p class="settle__sub">Residential and future residential sites across Adelaide, from 250 square metres to 100 acres.</p>
          <p class="settle__cta"><a class="btn" href="properties-for-sale.html">See what is available</a></p>
        </div>
      </div>
    </div>

    <!-- survey instrument readout, stays in the sky lane -->
    <div class="hud" id="hud" aria-hidden="true">
      <span class="hud__rule"></span>
      <p class="hud__place">Adelaide &middot; Northern corridor</p>
      <dl class="hud__rows">
        <div><dt>Bearing</dt><dd>018&deg;</dd></div>
        <div><dt>Status</dt><dd id="hudState">Surveying</dd></div>
      </dl>
    </div>
  </div>
</section>
